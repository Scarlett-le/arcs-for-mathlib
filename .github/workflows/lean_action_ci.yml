name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Audit final theorem axioms
        run: lake env lean ArcsForMathlib/Audit.lean
      - name: Audit public assumptions and structural layering
        run: python3 scripts/audit_assumptions.py --check docs/assumptions.md
